<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Lobby - Sudoku</title>
    <link rel="stylesheet"
          href="lobby.css">
</head>
<body>
    <div class="lobby">
        <header>
            <div class="logo">
                <img src="sukudo.jpg" alt="Sudoku Duel">
                <h1>SUDOKU DUEL</h1>
            </div>
            <div class="user">
                <div class="avatar">
                    N
                </div>
                <div>
                    <strong id="username">
                        Người chơi
                    </strong>
                    <p>● Online</p>
                </div>
            </div>
        </header>
        <main>
            <div class="title">
                <div>
                    <h2>Phòng chơi</h2>
                    <p>
                        Chọn phòng để bắt đầu trận đấu
                    </p>
                </div>
                <button onclick="location.reload()">
                    Làm mới
                </button>
            </div>
            <div class="create">
                <div>
                    <h3>Tạo phòng mới</h3>
                    <p>
                        Tạo phòng và chờ đối thủ tham gia
                    </p>
                </div>
                <button onclick="createRoom()">
                    + Tạo phòng
                </button>
            </div>
            <h2 class="room-title">
                Danh sách phòng
            </h2>
            <div class="room-list">
                <div class="room">
                    <div class="room-icon">
                        N
                    </div>
                    <div class="room-info">
                        <h3>Phòng của Nam</h3>
                        <p>
                            Phòng #001
                        </p>
                    </div>
                    <div class="players">
                         1 / 2
                    </div>
                    <span class="waiting">
                        Đang chờ
                    </span>
                    <button onclick="joinRoom('001')">
                        Vào phòng
                    </button>
                </div>
                <div class="room">
                    <div class="room-icon">
                        J
                    </div>
                    <div class="room-info">
                        <h3>Phòng của Jack</h3>
                        <p>
                            Phòng #002
                        </p>
                    </div>
                    <div class="players">
                         1 / 2
                    </div>
                    <span class="waiting">
                        Đang chờ
                    </span>
                    <button onclick="joinRoom('002')">
                        Vào phòng
                    </button>
                </div>
                <div class="room">
                    <div class="room-icon">
                        N
                    </div>
                    <div class="room-info">
                        <h3>Phòng của Nhi</h3>
                        <p>
                            Phòng #003
                        </p>
                    </div>
                    <div class="players">
                         2 / 2
                    </div>
                    <span class="full">
                        Đã đầy
                    </span>
                    <button class="disabled"
                            disabled>
                        Đã đầy
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script>
        const name =
            localStorage.getItem("username");
        if (name) {
            document.getElementById("username")
                .innerText = name;
        }
        function createRoom() {
            window.location.href =
                "create-room.html";
        }
        function joinRoom(roomId) {
            localStorage.setItem(
                "roomId",
                roomId
            );
            window.location.href =
                "room.html";
        }
    </script>
    <script src="lobby.js"> </script>   
</body>
</html>
