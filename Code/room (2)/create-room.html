<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Tạo phòng</title>

    <link rel="stylesheet"
          href="create-room.css">
</head>
<body>
    <div class="create-page">
        <div class="create-box">
            <h1>Tạo phòng</h1>
            <p>
                Tạo phòng Sudoku mới
            </p>
            <label>
                Tên phòng
            </label>
            <input
                type="text"
                id="roomName"
                placeholder="Nhập tên phòng">
                <label>
                    Cấp Độ 
                </label>
                    <input 
                    type="text"
                    id="level"
                    placeholder="Cấp độ người chơi">
            <p></p>
            <div class="buttons">
                <button
                    class="cancel"
                    onclick="goBack()">
                    Hủy
                </button>
                <button
                    class="create-btn"
                    onclick="createRoom()">
                    Tạo phòng
                </button>
            </div>
        </div>
    </div>
    <script>
        function goBack() {
            window.location.href =
                "lobby.html";
        }
        function createRoom() {
            const name =
                document
                .getElementById("roomName")
                .value
                .trim();
            if (name === "") {
                alert(
                    "Vui lòng nhập tên phòng"
                );
                return;
            }
            localStorage.setItem(
                "roomName",
                name
            );
            localStorage.setItem(
                "roomId",
                "001"
            );
            window.location.href =
                "room.html";
        }
    </script>
</body>
</html>
