<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

    <title>Sudoku Battle</title>
</head>

<body>

    <div class="box">
        <div class="container">

            <div class="top">
                <header>Đăng Nhập</header>
            </div>

            <div class="input-field">
                <input type="text" class="input" placeholder="Tên đăng nhập">
                <i class="bx bx-user"></i>
            </div>

            <div class="input-field">
                <input type="password" class="input" placeholder="Mật khẩu">
                <i class="bx bx-lock-alt"></i>
            </div>

            <div class="input-field">
                <input type="submit" class="submit" value="Đăng Nhập">
            </div>

            <div class="two-col">

                <div class="one">
                    <input type="checkbox" id="check">
                    <label for="check">Lưu Mật Khẩu</label>
                </div>

                <div class="two">
                    <label for="#">
                        <a href="#">Quên Mật Khẩu?</a>
                    </label>
                </div>

            </div>

        </div>
    </div>

</body>

</html>
